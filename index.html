<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>CLUBE PRIME BENEFÍCIOS TESTE - Testes</title>
  <style>
    :root {
      --bg: #070a13;
      --card: rgba(15, 23, 42, 0.85);
      --border: rgba(59, 130, 246, 0.25);
      --primary: #3b82f6;
      --cyan: #00f2fe;
      --purple: #7928ca;
      --emerald: #10b981;
      --text: #f8fafc;
      --muted: #94a3b8;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }

    body {
      background: var(--bg);
      color: var(--text);
      display: flex;
      justify-content: center;
      min-height: 100vh;
      padding: 16px;
    }

    .app-shell {
      width: 100%;
      max-width: 420px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 24px;
      padding: 24px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.5);
      backdrop-filter: blur(10px);
      align-self: center;
    }

    .screen { display: none; }
    .screen.active { display: block; }

    .badge {
      display: inline-block;
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 0.75rem;
      font-weight: 800;
      letter-spacing: 0.5px;
      text-transform: uppercase;
    }
    .badge.free { background: rgba(245, 158, 11, 0.15); color: #fbbf24; border: 1px solid #f59e0b; }
    .badge.vip { background: rgba(16, 185, 129, 0.2); color: #34d399; border: 1px solid var(--emerald); }

    .auth-tabs {
      display: flex;
      background: rgba(15, 23, 42, 0.8);
      padding: 4px;
      border-radius: 12px;
      border: 1px solid var(--border);
      margin: 16px 0;
    }

    .auth-tab {
      flex: 1;
      padding: 8px;
      text-align: center;
      font-size: 0.82rem;
      font-weight: 700;
      color: var(--muted);
      border-radius: 8px;
      cursor: pointer;
    }
    .auth-tab.active { background: var(--primary); color: #fff; }

    .form-group { margin-bottom: 12px; text-align: left; }
    .form-group label { font-size: 0.7rem; color: var(--muted); font-weight: 700; display: block; margin-bottom: 4px; }
    .form-control {
      width: 100%;
      padding: 12px 14px;
      border-radius: 12px;
      border: 1px solid var(--border);
      background: #0f172a;
      color: var(--text);
      outline: none;
    }

    .btn {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 12px;
      background: linear-gradient(135deg, var(--primary), var(--purple));
      color: white;
      font-weight: 800;
      font-size: 0.9rem;
      cursor: pointer;
      margin-top: 8px;
    }

    .btn-google { background: #ffffff; color: #0f172a; display: flex; align-items: center; justify-content: center; gap: 8px; }
    .btn-secondary { background: linear-gradient(135deg, var(--emerald), #059669); }
    .btn-outline { background: transparent; border: 1px solid var(--border); color: var(--text); }

    .avatar { width: 70px; height: 70px; border-radius: 50%; border: 2px solid var(--cyan); margin: 0 auto 10px; display: block; }

    .modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.85);
      z-index: 100;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }
    .modal.active { display: flex; }
    .modal-content { background: #0f172a; border: 1px solid var(--border); border-radius: 20px; padding: 20px; width: 100%; max-width: 360px; text-align: center; }
    .qr-box { background: #fff; padding: 8px; border-radius: 12px; width: 180px; height: 180px; margin: 12px auto; }
    .qr-box img { width: 100%; height: 100%; }
  </style>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, sendPasswordResetEmail, GoogleAuthProvider, signInWithPopup, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
    import { getFirestore, doc, setDoc, getDoc, updateDoc, onSnapshot, collection, getDocs } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyCTVY6ogF-o7pGuDeHPYCkGfrkeLTvpjKU",
      authDomain: "projeto-01-63111.firebaseapp.com",
      projectId: "projeto-01-63111",
      storageBucket: "projeto-01-63111.firebasestorage.app",
      messagingSenderId: "484791910480",
      appId: "1:484791910480:web:644bb77a68487c79881155"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);
    const googleProvider = new GoogleAuthProvider();

    window.firebaseAuth = auth;
    window.firebaseDb = db;
    window.googleProvider = googleProvider;
    window.dbMethods = { doc, setDoc, getDoc, updateDoc, onSnapshot, collection, getDocs, createUserWithEmailAndPassword, signInWithEmailAndPassword, sendPasswordResetEmail, signInWithPopup, signOut };

    onAuthStateChanged(auth, async (user) => {
      if (user) {
        const userDocRef = doc(db, "usuarios", user.uid);
        onSnapshot(userDocRef, async (snapshot) => {
          let data = snapshot.exists() ? snapshot.data() : { nome: user.displayName || "Cliente", email: user.email.toLowerCase(), vip: false };
          if (!snapshot.exists()) await setDoc(userDocRef, data);

          window.currentUserData = data;
          document.getElementById('user-name').innerText = data.nome || user.displayName || "Cliente";
          document.getElementById('user-email').innerText = data.email || user.email;
          document.getElementById('user-avatar').src = user.photoURL || `https://ui-avatars.com/api/?name=${encodeURIComponent(data.nome || 'U')}&background=00f2fe&color=070a13`;

          const badge = document.getElementById('status-badge');
          if (data.vip) {
            badge.innerText = "ASSINANTE VIP";
            badge.className = "badge vip";
          } else {
            badge.innerText = "PLANO GRATUITO";
            badge.className = "badge free";
          }
        });

        document.getElementById('screen-auth').classList.remove('active');
        document.getElementById('screen-dashboard').classList.add('active');
      } else {
        document.getElementById('screen-dashboard').classList.remove('active');
        document.getElementById('screen-auth').classList.add('active');
      }
    });
  </script>
</head>
<body>

  <div class="app-shell">
    
    <!-- TELA DE LOGIN -->
    <div id="screen-auth" class="screen active" style="text-align: center;">
      <h2 style="font-size:1.6rem; font-weight:900; color:var(--cyan); margin-bottom:4px;">Club Prime</h2>
      <p style="font-size:0.8rem; color:var(--muted); margin-bottom:16px;">Painel de Testes</p>

      <button class="btn btn-google" onclick="fazerLoginGoogle()">
        <svg width="18" height="18" viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/></svg>
        Entrar com o Google
      </button>

      <div class="auth-tabs">
        <div id="tab-login" class="auth-tab active" onclick="switchAuthTab('login')">Entrar</div>
        <div id="tab-signup" class="auth-tab" onclick="switchAuthTab('signup')">Cadastrar</div>
      </div>

      <div id="group-name" class="form-group" style="display:none;">
        <label>NOME</label>
        <input type="text" id="reg-name" class="form-control" placeholder="Seu nome">
      </div>

      <div class="form-group">
        <label>E-MAIL</label>
        <input type="email" id="reg-email" class="form-control" placeholder="seuemail@gmail.com">
      </div>

      <div class="form-group">
        <label>SENHA</label>
        <input type="password" id="reg-pass" class="form-control" placeholder="******">
      </div>

      <button id="btn-auth-submit" class="btn" onclick="executarAuth()">Entrar na Conta</button>
    </div>

    <!-- TELA PAINEL / TESTE PIX -->
    <div id="screen-dashboard" class="screen" style="text-align: center;">
      <img id="user-avatar" class="avatar" src="" alt="Avatar">
      <h3 id="user-name" style="font-weight: 800;">---</h3>
      <p id="user-email" style="font-size:0.8rem; color:var(--muted); margin-bottom:12px;">---</p>
      
      <div id="status-badge" class="badge free" style="margin-bottom: 20px;">PLANO GRATUITO</div>

      <button class="btn btn-secondary" onclick="gerarPixMercadoPago()">⚡ Gerar PIX R$ 1,20</button>
      <button class="btn btn-outline" style="margin-top:10px; color: #ef4444;" onclick="deslogar()">Sair da Conta</button>
    </div>

  </div>

  <!-- MODAL PIX -->
  <div id="modal-pix" class="modal">
    <div class="modal-content">
      <h3 style="font-size:1.1rem; font-weight:800;">Pagamento via PIX</h3>
      <div class="qr-box">
        <img id="pix-qr-img" src="" alt="QR Code Pix">
      </div>
      <button class="btn btn-secondary" style="margin-bottom:8px;" onclick="copiarPixCode()">📋 Copiar PIX</button>
      <button id="btn-checar-vip" class="btn" style="margin-bottom:8px;" onclick="verificarStatusVipManual()">🔄 Já Paguei / Checar VIP</button>
      <button class="btn btn-outline" onclick="fecharModal('modal-pix')">Fechar</button>
    </div>
  </div>

  <script>
    let pixCopiaColaAtual = "";
    let currentAuthTab = "login";

    function fecharModal(id) { document.getElementById(id).classList.remove('active'); }

    function switchAuthTab(type) {
      currentAuthTab = type;
      document.getElementById('tab-login').classList.toggle('active', type === 'login');
      document.getElementById('tab-signup').classList.toggle('active', type === 'signup');
      document.getElementById('group-name').style.display = type === 'signup' ? 'block' : 'none';
      document.getElementById('btn-auth-submit').innerText = type === 'login' ? 'Entrar na Conta' : 'Criar Conta';
    }

    async function fazerLoginGoogle() {
      try {
        await window.dbMethods.signInWithPopup(window.firebaseAuth, window.googleProvider);
      } catch (err) { alert(err.message); }
    }

    async function executarAuth() {
      const email = document.getElementById('reg-email').value;
      const pass = document.getElementById('reg-pass').value;

      if (!email || !pass) return alert("Preencha todos os campos!");

      try {
        if (currentAuthTab === 'signup') {
          const nome = document.getElementById('reg-name').value;
          const res = await window.dbMethods.createUserWithEmailAndPassword(window.firebaseAuth, email.trim().toLowerCase(), pass);
          await window.dbMethods.setDoc(window.dbMethods.doc(window.firebaseDb, "usuarios", res.user.uid), {
            nome: nome || "Cliente", email: email.trim().toLowerCase(), vip: false, criadoEm: new Date().toISOString()
          });
        } else {
          await window.dbMethods.signInWithEmailAndPassword(window.firebaseAuth, email, pass);
        }
      } catch (err) { alert(err.message); }
    }

    async function deslogar() {
      await window.dbMethods.signOut(window.firebaseAuth);
    }

    async function gerarPixMercadoPago() {
      const user = window.firebaseAuth.currentUser;
      if (!user) return alert("Faça login!");

      try {
        const response = await fetch('https://webhook-clubprime.vercel.app/api/criar-pix', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email: user.email.toLowerCase(), nome: window.currentUserData?.nome || 'Membro' })
        });
        const data = await response.json();
        if (data.success && data.qrCodeBase64) {
          document.getElementById('pix-qr-img').src = data.qrCodeBase64;
          pixCopiaColaAtual = data.qrCodeCopiaCola;
          document.getElementById('modal-pix').classList.add('active');
        } else alert(data.error || "Erro ao gerar PIX");
      } catch (err) { alert(err.message); }
    }

    function copiarPixCode() {
      if (!pixCopiaColaAtual) return;
      navigator.clipboard.writeText(pixCopiaColaAtual);
      alert("PIX copiado!");
    }

    async function verificarStatusVipManual() {
      const user = window.firebaseAuth.currentUser;
      if (!user) return;

      const emailBusca = user.email.trim().toLowerCase();
      const btn = document.getElementById('btn-checar-vip');
      btn.innerText = "Verificando...";

      try {
        const snapshot = await window.dbMethods.getDocs(window.dbMethods.collection(window.firebaseDb, "usuarios"));
        let ativo = false;

        snapshot.forEach(docSnap => {
          const data = docSnap.data();
          if (data.email && data.email.trim().toLowerCase() === emailBusca && data.vip === true) {
            ativo = true;
          }
        });

        if (ativo) {
          try {
            await window.dbMethods.updateDoc(window.dbMethods.doc(window.firebaseDb, "usuarios", user.uid), { vip: true });
          } catch(e){}
          fecharModal('modal-pix');
          alert("VIP Ativado com Sucesso!");
        } else {
          alert(`Ainda aguardando confirmação do pagamento para ${emailBusca}...`);
        }
      } catch (err) { alert(err.message); }
      finally { btn.innerText = "🔄 Já Paguei / Checar VIP"; }
    }
  </script>
</body>
</html>
