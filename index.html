<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Clube Prime Pelotas - Em Breve</title>
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#2563eb">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    body {
      background-color: #0f172a;
      color: #ffffff;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 24px;
    }
    .container {
      max-width: 480px;
      width: 100%;
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 16px;
      padding: 32px 24px;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
    }
    .badge {
      display: inline-block;
      background-color: #2563eb22;
      color: #60a5fa;
      border: 1px solid #2563eb88;
      font-size: 14px;
      font-weight: 600;
      padding: 6px 16px;
      border-radius: 20px;
      margin-bottom: 20px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    h1 {
      font-size: 28px;
      font-weight: 800;
      margin-bottom: 12px;
      color: #f8fafc;
    }
    p {
      color: #94a3b8;
      font-size: 16px;
      line-height: 1.5;
      margin-bottom: 24px;
    }
    .price-tag {
      background: #0f172a;
      border: 1px dashed #3b82f6;
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 24px;
    }
    .price-tag span {
      display: block;
      color: #94a3b8;
      font-size: 14px;
    }
    .price-tag strong {
      color: #22c55e;
      font-size: 32px;
      font-weight: 800;
    }
    .btn-whatsapp {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      background-color: #22c55e;
      color: #ffffff;
      text-decoration: none;
      font-size: 18px;
      font-weight: 700;
      padding: 16px 24px;
      border-radius: 12px;
      transition: background-color 0.2s ease, transform 0.1s ease;
      box-shadow: 0 4px 14px rgba(34, 197, 94, 0.4);
    }
    .btn-whatsapp:active {
      transform: scale(0.98);
      background-color: #16a34a;
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="badge">⚡ Em Breve</div>
    <h1>Clube Prime Pelotas</h1>
    <p>O seu clube exclusivo de vantagens e cupons de desconto está chegando a Pelotas!</p>
    
    <div class="price-tag">
      <span>Garantir acesso antecipado por apenas</span>
      <strong>R$ 9,90</strong>
    </div>

    <!-- Substiua o número no link abaixo pelo seu número com DDD se for diferente de 53 -->
    <a href="https://wa.me/5553999999999?text=Olá!%20Quero%20fazer%20a%20pré-compra%20do%20Clube%20Prime%20por%20R$9,90" target="_blank" class="btn-whatsapp">
      📲 Fazer Pré-compra no WhatsApp
    </a>
  </div>

</body>
</html>
