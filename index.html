<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Clube Prime - Em breve</title>
  <meta name="description" content="Clube Prime Pelotas: cupons de desconto nos melhores parceiros da cidade. Em breve.">
  <meta name="theme-color" content="#2563eb">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;800&display=swap">
  <style>
    :root {
      --bg: #f8fafc;
      --text: #0f172a;
      --muted: #64748b;
      --primary: #2563eb;
      --ticket: #ffffff;
      --line: #cbd5e1;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0b1220;
        --text: #f1f5f9;
        --muted: #94a3b8;
        --primary: #60a5fa;
        --ticket: #131c2e;
        --line: #2b3a55;
      }
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: "Plus Jakarta Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: max(24px, env(safe-area-inset-top)) 24px max(24px, env(safe-area-inset-bottom));
      text-align: center;
    }
    main { width: 100%; max-width: 380px; }

    .ticket {
      display: flex;
      background: var(--ticket);
      border: 1.5px dashed var(--line);
      border-radius: 20px;
      overflow: hidden;
      margin-bottom: 32px;
      text-align: left;
    }
    .stub {
      background: var(--primary);
      color: #fff;
      width: 38%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 22px 8px;
      border-right: 2px dashed rgba(255, 255, 255, 0.55);
    }
    .stub .big { font-size: 2.6rem; font-weight: 800; line-height: 1; }
    .stub .small { font-size: 0.85rem; font-weight: 800; letter-spacing: 0.06em; margin-top: 4px; }
    .info { flex: 1; padding: 18px 16px; display: flex; flex-direction: column; justify-content: center; gap: 4px; }
    .info strong { font-size: 1.05rem; font-weight: 800; }
    .info span { font-size: 0.8rem; color: var(--muted); font-weight: 500; }

    h1 { font-size: 1.9rem; font-weight: 800; line-height: 1.15; }
    p { margin-top: 10px; font-size: 0.95rem; line-height: 1.5; color: var(--muted); font-weight: 500; }
    .foot { margin-top: 36px; font-size: 0.75rem; color: var(--muted); }
  </style>
</head>
<body>
  <main>
    <div class="ticket" aria-hidden="true">
      <div class="stub">
        <span class="big">?</span>
        <span class="small">OFF</span>
      </div>
      <div class="info">
        <strong>Clube Prime</strong>
        <span>Pelotas / RS</span>
      </div>
    </div>

    <h1>Em breve</h1>
    <p>Estamos preparando cupons de desconto nos melhores lugares de Pelotas. Volte logo para conferir.</p>

    <div class="foot">Clube Prime &bull; Pelotas / RS</div>
  </main>
</body>
</html>
